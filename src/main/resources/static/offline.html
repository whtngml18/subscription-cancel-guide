<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1f4fa8">
    <title>인터넷 연결 없음 | 구독 해지 가이드</title>
    <!-- 인터넷이 없을 때 보이는 화면이라 외부 글꼴·CSS 없이 스타일을 이 파일 안에 넣는다 (색은 site.css와 같게) -->
    <style>
        :root {
            --text: #1f2328;
            --muted: #59636e;
            --line: #d0d7de;
            --accent: #1f4fa8;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: #fff;
            color: var(--text);
            font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
            line-height: 1.6;
            word-break: keep-all;
            text-align: center;
        }
        .box {
            max-width: 400px;
            padding: 32px 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
        }
        img {
            width: 64px;
            height: 64px;
        }
        h1 {
            font-size: 1.4rem;
            line-height: 1.3;
        }
        p {
            color: var(--muted);
        }
        button {
            margin-top: 8px;
            min-height: 44px;
            padding: 8px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<main class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>인터넷에 연결되지 않았어요</h1>
    <p>와이파이나 모바일 데이터를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>

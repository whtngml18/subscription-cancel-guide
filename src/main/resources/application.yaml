spring:
  application:
    name: subscription-cancel-guide
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: true

  sql:
    init:
      encoding: UTF-8

  # 아이콘 업로드. 200KB 검사는 앱(IconValidator)이 하고, 이 값은 그보다 넉넉한 바깥 한도
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:dev-admin-1234}
      roles: ADMIN

# 사이트 주소 (canonical, Open Graph, sitemap에 사용). 끝에 /를 붙이지 않는다. 배포할 때 환경변수 APP_BASE_URL로 바꾼다.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  # 제보 글을 단계로 나누는 AI (OpenAI 호환 주소: 기본 Google Gemini). 키는 저장소에 넣지 않고 환경변수로 넣는다.
  # 키가 없으면 앱은 그대로 켜지고 AI 미리보기 버튼만 숨긴다. 학교 factchat으로 돌아갈 때는 AI_BASE_URL, AI_MODEL, AI_TRAILING_SLASH=true.
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:${FACTCHAT_API_KEY:}}}
    model: ${AI_MODEL:gemini-2.5-flash}
    trailing-slash: ${AI_TRAILING_SLASH:false}

spring:
  application:
    name: subscription-cancel-guide
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: true

  sql:
    init:
      encoding: UTF-8

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD}
      roles: ADMIN


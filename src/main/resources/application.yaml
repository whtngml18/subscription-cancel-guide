spring:
  application:
    name: subscription-cancel-guide
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: true

  sql:
    init:
      encoding: UTF-8

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD}
      roles: ADMIN

# 사이트 주소 (canonical, Open Graph, sitemap에 사용). 끝에 /를 붙이지 않는다. 배포할 때 환경변수 APP_BASE_URL로 바꾼다.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  # 제보 글을 단계로 나누는 AI (학교 factchat API Gateway, OpenAI 호환). 키는 저장소에 넣지 않고 환경변수 FACTCHAT_API_KEY로 넣는다.
  # 키가 없으면 앱은 그대로 켜지고 AI 미리보기 버튼만 숨긴다.
  ai:
    base-url: ${AI_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway}
    api-key: ${FACTCHAT_API_KEY:}
    model: ${AI_MODEL:claude-haiku-4-5-20251001}

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: noindexHead('\'' + ${keyword} + '\' 검색 결과 | 구독 해지 가이드')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="container">
    <a class="d-inline-block mb-2" th:href="@{/}">← 처음으로</a>

    <h1 class="h3 mb-3" th:text="'\'' + ${keyword} + '\' 검색 결과'">검색 결과</h1>

    <div class="alert alert-light border" th:if="${page.isEmpty()}">
        <p th:text="'아직 \'' + ${keyword} + '\'의 해지 방법이 없어요.'">결과가 없어요.</p>
        <p class="mb-3">직접 해지해 보셨다면 방법을 알려 주세요.</p>
        <a class="btn btn-primary" th:href="@{/submit(name=${keyword})}">해지 방법 제보하기</a>
    </div>

    <div class="list-group" th:unless="${page.isEmpty()}">
        <a class="list-group-item list-group-item-action py-3"
           th:each="subscription : ${page.content}"
           th:href="@{/guide/{slug}(slug=${subscription.slug})}"
           th:text="${subscription.name}">서비스 이름</a>
    </div>

    <nav class="mt-4" th:if="${page.totalPages > 1}" aria-label="페이지">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/search(q=${keyword}, page=${page.number - 1}, size=${page.size})}">← 이전</a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/search(q=${keyword}, page=${page.number + 1}, size=${page.size})}">다음 →</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>

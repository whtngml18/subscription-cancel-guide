<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: noindexHead('\'' + ${keyword} + '\' 검색 결과 | 구독 해지 가이드')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="wrap">
    <nav th:replace="~{fragments/layout :: breadcrumb(null, '검색 결과')}"></nav>

    <h1 th:text="'\'' + ${keyword} + '\' 검색 결과'">검색 결과</h1>

    <div class="notice" th:if="${page.isEmpty()}">
        <p><strong th:text="'\'' + ${keyword} + '\' 가이드가 아직 없어요.'">가이드가 아직 없어요.</strong></p>
        <p>직접 해지해 보셨다면 방법을 알려 주세요.</p>
        <a class="btn btn-primary" th:href="@{/submit(name=${keyword})}">해지 방법 제보하기</a>
    </div>

    <ul class="svc-list" th:unless="${page.isEmpty()}">
        <li th:each="subscription : ${page.content}">
            <a th:replace="~{fragments/ui :: serviceRow(${subscription}, ${stepCounts[subscription.id] ?: 0})}"></a>
        </li>
    </ul>

    <nav class="pager" th:if="${page.totalPages > 1}" aria-label="페이지">
        <a th:if="${page.hasPrevious()}"
           th:href="@{/search(q=${keyword}, page=${page.number - 1}, size=${page.size})}">← 이전</a>
        <span th:unless="${page.hasPrevious()}" aria-disabled="true">← 이전</span>
        <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
        <a th:if="${page.hasNext()}"
           th:href="@{/search(q=${keyword}, page=${page.number + 1}, size=${page.size})}">다음 →</a>
        <span th:unless="${page.hasNext()}" aria-disabled="true">다음 →</span>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>

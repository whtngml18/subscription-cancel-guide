<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'\'' + ${keyword} + '\' 검색 결과 | 구독 해지 가이드'">검색 결과 | 구독 해지 가이드</title>
</head>
<body>
<a th:href="@{/}">← 처음으로</a>

<form th:action="@{/search}" method="get">
    <input type="text" name="q" th:value="${keyword}" placeholder="서비스 이름을 입력하세요">
    <button type="submit">검색</button>
</form>

<h1 th:text="'\'' + ${keyword} + '\' 검색 결과'">검색 결과</h1>

<div th:if="${results.isEmpty()}">
    <p th:text="'아직 \'' + ${keyword} + '\'의 해지 방법이 없어요.'">결과가 없어요.</p>
    <a th:href="@{/submit}">해지 방법 제보하기</a>
</div>

<ul th:unless="${results.isEmpty()}">
    <li th:each="subscription : ${results}">
        <a th:href="@{/guide/{slug}(slug=${subscription.slug})}"
           th:text="${subscription.name}">서비스 이름</a>
    </li>
</ul>
</body>
</html>

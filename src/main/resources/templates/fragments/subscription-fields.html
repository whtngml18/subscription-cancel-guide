<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  서비스 정보 입력 칸 (SubscriptionForm). 구역 3개: 기본 정보 / 해지 정보 / 확인
  서비스 등록·수정 화면과 제보 승인 화면이 함께 쓴다. th:object="${form}"인 <form enctype="multipart/form-data"> 안에 넣는다.
  오류가 있으면 입력 칸에 aria-invalid와 aria-describedby="{칸}-error"를 붙여 오류 문구와 연결한다.
-->
<th:block th:fragment="fields">
    <fieldset class="form-section">
        <legend>기본 정보</legend>

        <div class="form-grid">
            <label for="categoryId">카테고리</label>
            <div>
                <select id="categoryId" th:field="*{categoryId}"
                        th:attr="aria-invalid=${#fields.hasErrors('categoryId')} ? 'true' : null,
                                 aria-describedby=${#fields.hasErrors('categoryId')} ? 'categoryId-error' : null">
                    <option value="">선택하세요</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">카테고리</option>
                    <option value="0">+ 새 카테고리</option>
                </select>
                <p class="field-error" id="categoryId-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">오류</p>
            </div>
        </div>

        <!-- "+ 새 카테고리"를 골랐을 때만 보인다. 스크립트가 없으면 늘 보인다. -->
        <div id="newCategoryFields">
            <div class="form-grid">
                <label for="newCategoryName">새 카테고리 이름</label>
                <div>
                    <input type="text" id="newCategoryName" th:field="*{newCategoryName}" maxlength="30" placeholder="배달·생활"
                           th:attr="aria-invalid=${#fields.hasErrors('newCategoryName')} ? 'true' : null,
                                    aria-describedby=${#fields.hasErrors('newCategoryName')} ? 'newCategoryName-error' : null">
                    <p class="field-error" id="newCategoryName-error" th:if="${#fields.hasErrors('newCategoryName')}" th:errors="*{newCategoryName}">오류</p>
                </div>
            </div>
            <div class="form-grid">
                <label for="newCategorySlug">새 카테고리 주소</label>
                <div>
                    <input type="text" id="newCategorySlug" th:field="*{newCategorySlug}" maxlength="30" placeholder="delivery"
                           th:attr="aria-invalid=${#fields.hasErrors('newCategorySlug')} ? 'true' : null,
                                    aria-describedby=${#fields.hasErrors('newCategorySlug')} ? 'newCategorySlug-error' : 'newCategorySlug-help'">
                    <p class="field-help" id="newCategorySlug-help">영어 소문자, 숫자, -. 만든 뒤에는 바꿀 수 없어요.</p>
                    <p class="field-error" id="newCategorySlug-error" th:if="${#fields.hasErrors('newCategorySlug')}" th:errors="*{newCategorySlug}">오류</p>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var select = document.getElementById('categoryId');
                var fields = document.getElementById('newCategoryFields');
                function toggle() { fields.hidden = select.value !== '0'; }
                select.addEventListener('change', toggle);
                toggle();
            })();
        </script>

        <div class="form-grid">
            <label for="name">서비스 이름</label>
            <div>
                <input type="text" id="name" th:field="*{name}" maxlength="50" placeholder="디즈니 플러스"
                       th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null">
                <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="slug">slug</label>
            <div>
                <input type="text" id="slug" th:field="*{slug}" maxlength="50" placeholder="disney-plus"
                       th:attr="aria-invalid=${#fields.hasErrors('slug')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('slug')} ? 'slug-error slug-help' : 'slug-help'">
                <p class="field-error" id="slug-error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">오류</p>
                <p class="field-help" id="slug-help">주소에 쓰는 영어 이름 (/guide/disney-plus)</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="brandColor">브랜드 색</label>
            <div>
                <input type="text" id="brandColor" th:field="*{brandColor}" placeholder="#113CCF"
                       th:attr="aria-invalid=${#fields.hasErrors('brandColor')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('brandColor')} ? 'brandColor-error' : null">
                <p class="field-error" id="brandColor-error" th:if="${#fields.hasErrors('brandColor')}" th:errors="*{brandColor}">오류</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="iconFile">아이콘</label>
            <div>
                <img th:if="${subscription != null and subscription.icon != null}"
                     th:src="@{/admin/icons/{id}(id=${subscription.icon.id})}" width="48" height="48" alt="현재 아이콘" class="svc-icon">
                <input type="file" id="iconFile" name="iconFile" accept="image/png,image/jpeg,image/webp"
                       th:attr="aria-invalid=${#fields.hasErrors('iconFile')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('iconFile')} ? 'iconFile-error iconFile-help' : 'iconFile-help'">
                <p class="field-error" id="iconFile-error" th:if="${#fields.hasErrors('iconFile')}" th:errors="*{iconFile}">오류</p>
                <p class="field-help" id="iconFile-help">PNG, JPEG, WebP · 200KB까지. 고르지 않으면 지금 아이콘을 그대로 둬요.</p>
            </div>
        </div>
    </fieldset>

    <fieldset class="form-section">
        <legend>해지 정보</legend>

        <div class="form-grid">
            <span class="label">해지하는 곳</span>
            <div class="check-row">
                <label th:each="channel : ${T(com.whtngml.subscription_cancel_guide.domain.CancelChannel).values()}">
                    <input type="checkbox" th:field="*{channels}" th:value="${channel}">
                    <span th:text="${channel.label}">앱</span>
                </label>
            </div>
        </div>

        <div class="form-grid">
            <label for="difficulty">난이도</label>
            <div>
                <select id="difficulty" th:field="*{difficulty}">
                    <option value="">선택 안 함</option>
                    <option th:each="d : ${T(com.whtngml.subscription_cancel_guide.domain.Difficulty).values()}"
                            th:value="${d}" th:text="${d.label}">쉬움</option>
                </select>
            </div>
        </div>

        <div class="form-grid">
            <label for="estimatedMinutes">예상 시간 (분)</label>
            <div>
                <input type="number" min="1" max="120" id="estimatedMinutes" th:field="*{estimatedMinutes}"
                       th:attr="aria-invalid=${#fields.hasErrors('estimatedMinutes')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('estimatedMinutes')} ? 'estimatedMinutes-error' : null">
                <p class="field-error" id="estimatedMinutes-error" th:if="${#fields.hasErrors('estimatedMinutes')}" th:errors="*{estimatedMinutes}">오류</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="officialCancelUrl">공식 해지 링크</label>
            <div>
                <input type="url" id="officialCancelUrl" th:field="*{officialCancelUrl}" placeholder="https://"
                       th:attr="aria-invalid=${#fields.hasErrors('officialCancelUrl')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('officialCancelUrl')} ? 'officialCancelUrl-error' : null">
                <p class="field-error" id="officialCancelUrl-error" th:if="${#fields.hasErrors('officialCancelUrl')}" th:errors="*{officialCancelUrl}">오류</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="caution">주의할 점</label>
            <div>
                <textarea id="caution" th:field="*{caution}" rows="2" maxlength="500"
                          placeholder="앱스토어로 결제했다면 앱스토어에서 해지해야 해요."
                          th:attr="aria-invalid=${#fields.hasErrors('caution')} ? 'true' : null,
                                   aria-describedby=${#fields.hasErrors('caution')} ? 'caution-error' : null"></textarea>
                <p class="field-error" id="caution-error" th:if="${#fields.hasErrors('caution')}" th:errors="*{caution}">오류</p>
            </div>
        </div>

        <div class="form-grid">
            <label for="refundInfo">환불 안내</label>
            <div>
                <textarea id="refundInfo" th:field="*{refundInfo}" rows="2" maxlength="1000"
                          th:attr="aria-invalid=${#fields.hasErrors('refundInfo')} ? 'true' : null,
                                   aria-describedby=${#fields.hasErrors('refundInfo')} ? 'refundInfo-error' : null"></textarea>
                <p class="field-error" id="refundInfo-error" th:if="${#fields.hasErrors('refundInfo')}" th:errors="*{refundInfo}">오류</p>
            </div>
        </div>
    </fieldset>

    <fieldset class="form-section">
        <legend>확인</legend>
        <div class="form-grid">
            <label for="verifiedAt">마지막 확인일</label>
            <div>
                <input type="date" id="verifiedAt" th:field="*{verifiedAt}">
            </div>
        </div>
    </fieldset>
</th:block>
</body>
</html>

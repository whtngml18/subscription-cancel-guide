<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  서비스 정보 입력 칸 (SubscriptionForm)
  서비스 등록·수정 화면과 제보 승인 화면이 함께 쓴다. th:object="${form}"인 <form> 안에 넣는다.
-->
<th:block th:fragment="fields">
    <div class="mb-3">
        <label class="form-label" for="categoryId">카테고리</label>
        <select class="form-select" th:errorclass="is-invalid" id="categoryId" th:field="*{categoryId}">
            <option value="">선택하세요</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}">카테고리</option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="name">서비스 이름</label>
        <input class="form-control" th:errorclass="is-invalid" type="text" id="name" th:field="*{name}" placeholder="디즈니 플러스">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="slug">slug (주소에 쓰는 영어 이름)</label>
        <input class="form-control" th:errorclass="is-invalid" type="text" id="slug" th:field="*{slug}" placeholder="disney-plus">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="brandColor">브랜드 색</label>
        <input class="form-control" th:errorclass="is-invalid" type="text" id="brandColor" th:field="*{brandColor}" placeholder="#113CCF">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('brandColor')}" th:errors="*{brandColor}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="refundInfo">환불 안내</label>
        <textarea class="form-control" th:errorclass="is-invalid" id="refundInfo" th:field="*{refundInfo}" rows="3"></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('refundInfo')}" th:errors="*{refundInfo}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="verifiedAt">마지막 확인일</label>
        <input class="form-control" type="date" id="verifiedAt" th:field="*{verifiedAt}">
    </div>
    <h2 class="h6 mt-4 mb-3 border-top pt-3">해지 정보</h2>

    <div class="mb-3">
        <span class="form-label d-block">해지하는 곳</span>
        <div class="form-check form-check-inline" th:each="channel : ${T(com.whtngml.subscription_cancel_guide.domain.CancelChannel).values()}">
            <input class="form-check-input" type="checkbox" th:field="*{channels}" th:value="${channel}">
            <label class="form-check-label" th:for="${#ids.prev('channels')}" th:text="${channel.label}">앱</label>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="caution">주의할 점</label>
        <textarea class="form-control" th:errorclass="is-invalid" id="caution" th:field="*{caution}" rows="2" maxlength="500"
                  placeholder="앱스토어로 결제했다면 앱스토어에서 해지해야 해요."></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('caution')}" th:errors="*{caution}">오류</div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-sm-4">
            <label class="form-label" for="difficulty">난이도</label>
            <select class="form-select" id="difficulty" th:field="*{difficulty}">
                <option value="">선택 안 함</option>
                <option th:each="d : ${T(com.whtngml.subscription_cancel_guide.domain.Difficulty).values()}"
                        th:value="${d}" th:text="${d.label}">쉬움</option>
            </select>
        </div>
        <div class="col-sm-4">
            <label class="form-label" for="estimatedMinutes">예상 시간 (분)</label>
            <input class="form-control" th:errorclass="is-invalid" type="number" min="1" max="120" id="estimatedMinutes" th:field="*{estimatedMinutes}">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('estimatedMinutes')}" th:errors="*{estimatedMinutes}">오류</div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="officialCancelUrl">공식 해지 링크</label>
        <input class="form-control" th:errorclass="is-invalid" type="url" id="officialCancelUrl" th:field="*{officialCancelUrl}" placeholder="https://">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('officialCancelUrl')}" th:errors="*{officialCancelUrl}">오류</div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="iconFile">아이콘 (PNG, JPEG, WebP · 200KB까지)</label>
        <div class="d-flex align-items-center gap-3">
            <img th:if="${subscription != null and subscription.icon != null}"
                 th:src="@{/admin/icons/{id}(id=${subscription.icon.id})}" width="48" height="48" alt="현재 아이콘" class="rounded border">
            <input class="form-control" th:classappend="${#fields.hasErrors('iconFile')} ? 'is-invalid'" type="file" id="iconFile" name="iconFile"
                   accept="image/png,image/jpeg,image/webp">
        </div>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('iconFile')}" th:errors="*{iconFile}">오류</div>
    </div>
</th:block>
</body>
</html>

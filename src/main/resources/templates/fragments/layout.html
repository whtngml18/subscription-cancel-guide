<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  모든 화면이 함께 쓰는 조각
  - pageHead(title, description, path): 검색에 나올 화면의 <head>. description·canonical·Open Graph를 함께 만든다
    (path는 '/guide/netflix'처럼 사이트 주소 뒤에 붙는 부분)
  - noindexHead(title): 검색엔진에 나오지 않을 사용자 화면(검색 결과, 제보 완료, 오류)의 <head>
  - adminHead(title): 관리자 화면의 <head> (noindex, 서비스 워커 없음)
  - siteHeader(showSearch): 사용자 화면 상단 메뉴. 메인처럼 검색창이 따로 있으면 false
  - adminHeader: 관리자 화면 상단 메뉴 (adminMenu로 지금 메뉴 표시, pendingCount로 대기 배지)
  - siteFooter: 하단
  - breadcrumb(category, current): 위치 표시 (홈 › 카테고리 › 현재 화면). category·current는 비워도 된다
  (조각 이름을 head·header·footer로 지으면 같은 이름의 태그까지 선택되므로 다르게 짓는다)
-->
<head th:fragment="pageHead(title, description, path)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">구독 해지 가이드</title>
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${baseUrl + path}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="구독 해지 가이드">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${baseUrl + path}">
    <meta property="og:locale" content="ko_KR">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#1f4fa8">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <script th:src="@{/js/register-sw.js}" defer></script>
</head>

<!-- 검색 결과·제보 완료·오류 화면은 검색엔진에 나오지 않게 noindex -->
<head th:fragment="noindexHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${title}">구독 해지 가이드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#1f4fa8">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <script th:src="@{/js/register-sw.js}" defer></script>
</head>

<!-- 관리자 화면 (noindex, Bootstrap) -->
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${title}">구독 해지 가이드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <meta name="theme-color" content="#1f4fa8">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}">
</head>
<body>

<header th:fragment="siteHeader(showSearch)" class="site-header">
    <div class="wrap">
        <a class="site-logo" th:href="@{/}">구독 해지 가이드</a>

        <form th:if="${showSearch}" class="header-search" th:action="@{/search}" method="get" role="search">
            <input type="search" name="q" th:value="${keyword}"
                   placeholder="서비스 이름 검색" aria-label="서비스 이름 검색">
            <button class="btn btn-secondary" type="submit">검색</button>
        </form>

        <a th:href="@{/submit}">제보하기</a>
    </div>
</header>

<header th:fragment="adminHeader" class="site-header admin-header">
    <div class="wrap-wide">
        <a class="site-logo" th:href="@{/admin/guides}">관리자</a>
        <nav aria-label="관리자 메뉴">
            <a th:href="@{/admin/guides}" th:attr="aria-current=${adminMenu == 'guides'} ? 'page' : null">가이드 관리</a>
            <a th:href="@{/admin/submissions}" th:attr="aria-current=${adminMenu == 'submissions'} ? 'page' : null">제보 검토<span
                    class="badge" th:if="${pendingCount != null and pendingCount > 0}"
                    th:text="${pendingCount}">3</span><span class="visually-hidden"
                    th:if="${pendingCount != null and pendingCount > 0}">건 대기</span></a>
            <a th:href="@{/admin/categories}" th:attr="aria-current=${adminMenu == 'categories'} ? 'page' : null">카테고리</a>
            <a th:href="@{/}">사이트 보기</a>
        </nav>
        <form th:action="@{/admin/logout}" method="post">
            <button class="btn btn-secondary btn-sm" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<nav th:fragment="breadcrumb(category, current)" class="breadcrumb" aria-label="위치">
    <ol>
        <li><a th:href="@{/}">홈</a></li>
        <li th:if="${category != null}">
            <a th:href="@{/category/{slug}(slug=${category.slug})}" th:text="${category.name}">카테고리</a>
        </li>
        <li th:if="${current != null}" aria-current="page" th:text="${current}">현재 화면</li>
    </ol>
</nav>

<footer th:fragment="siteFooter" class="site-footer">
    <div class="wrap">
        <p>구독 해지 가이드 · 해지 방법은 서비스 사정에 따라 바뀔 수 있어요.</p>
        <p>틀린 내용을 발견하면 가이드 아래 "달라요"를 눌러 알려 주세요.</p>
    </div>
</footer>

</body>
</html>

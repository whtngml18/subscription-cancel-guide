<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  모든 화면이 함께 쓰는 조각
  - pageHead(title, description, path): 검색에 나올 화면의 <head>. description·canonical·Open Graph를 함께 만든다
    (path는 '/guide/netflix'처럼 사이트 주소 뒤에 붙는 부분)
  - noindexHead(title): 검색엔진에 나오지 않을 화면(관리자, 검색 결과, 제보 완료)의 <head>
  - siteHeader(showSearch): 사용자 화면 상단 메뉴. 메인처럼 검색창이 따로 있으면 false
  - adminHeader: 관리자 화면 상단 메뉴
  - siteFooter: 하단
  (조각 이름을 head·header·footer로 지으면 같은 이름의 태그까지 선택되므로 다르게 짓는다)
-->
<head th:fragment="pageHead(title, description, path)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">구독 해지 가이드</title>
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${baseUrl + path}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="구독 해지 가이드">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${baseUrl + path}">
    <meta property="og:locale" content="ko_KR">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/phone.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0d6efd">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <script th:src="@{/js/register-sw.js}" defer></script>
</head>

<!-- 관리자·검색 결과·제보 완료 화면은 검색엔진에 나오지 않게 noindex -->
<head th:fragment="noindexHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${title}">구독 해지 가이드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/phone.css}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#0d6efd">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <script th:src="@{/js/register-sw.js}" defer></script>
</head>
<body>

<header th:fragment="siteHeader(showSearch)" class="site-header border-bottom bg-white mb-4">
    <div class="container d-flex flex-wrap align-items-center gap-2 py-2">
        <a class="site-logo me-auto" th:href="@{/}">구독 해지 가이드</a>

        <form th:if="${showSearch}" class="header-search d-flex gap-2" th:action="@{/search}" method="get" role="search">
            <input class="form-control" type="search" name="q" th:value="${keyword}"
                   placeholder="서비스 이름 검색" aria-label="서비스 이름 검색">
            <button class="btn btn-outline-primary text-nowrap" type="submit">검색</button>
        </form>

        <a class="btn btn-primary text-nowrap" th:href="@{/submit}">제보하기</a>
    </div>
</header>

<header th:fragment="adminHeader" class="site-header border-bottom bg-white mb-4">
    <div class="container d-flex flex-wrap align-items-center gap-2 py-2">
        <a class="site-logo me-auto" th:href="@{/admin/guides}">관리자</a>
        <a class="btn btn-link" th:href="@{/admin/guides}">가이드 관리</a>
        <a class="btn btn-link" th:href="@{/admin/submissions}">제보 검토</a>
        <a class="btn btn-link" th:href="@{/}">사이트 보기</a>
        <form th:action="@{/admin/logout}" method="post">
            <button class="btn btn-outline-secondary" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<footer th:fragment="siteFooter" class="site-footer border-top mt-5 py-4">
    <div class="container small text-secondary">
        <p class="mb-1">구독 해지 가이드 · 해지 방법은 서비스 사정에 따라 바뀔 수 있어요.</p>
        <p class="mb-0">틀린 내용을 발견하면 가이드 아래 "달라요"를 눌러 알려 주세요.</p>
    </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  해지 단계 하나를 휴대폰 화면 도식으로 그린다.
  step: GuideStep, color: 서비스 브랜드 색(#RRGGBB, 없으면 null)
-->
<figure th:fragment="phone(step, color)" class="phone"
        th:style="${#strings.isEmpty(color)} ? null : '--brand: ' + ${color}">
    <div class="phone-screen">
        <div class="phone-bar">
            <span class="phone-step" th:text="${step.stepOrder}">1</span>
            <span th:text="${step.screenName}">화면</span>
        </div>

        <div class="phone-body">
            <!-- 실제 앱 화면처럼 보이지 않도록 메뉴는 회색 줄로만 표시 -->
            <span class="phone-line"></span>
            <span class="phone-line"></span>
            <span class="phone-line short"></span>
            <span class="phone-line"></span>

            <span class="phone-target"
                  th:classappend="${#strings.isEmpty(step.position)} ? 'pos-middle' : 'pos-' + ${step.position}"
                  th:text="${step.targetLabel}">누를 버튼</span>
        </div>
    </div>
    <figcaption th:text="${step.description}">설명</figcaption>
</figure>
</body>
</html>

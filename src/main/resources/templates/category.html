<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${category.name} + ' 구독 해지 방법 | 구독 해지 가이드', ${category.name} + ' 구독 서비스의 해지 방법을 모았어요. 서비스를 고르면 단계별 화면 그림으로 볼 수 있어요.', '/category/' + ${category.slug})}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="container">
    <a class="d-inline-block mb-2" th:href="@{/}">← 처음으로</a>

    <h1 class="h3 mb-3" th:text="${category.name}">카테고리 이름</h1>

    <p class="text-secondary" th:if="${page.isEmpty()}">아직 등록된 서비스가 없어요.</p>

    <div class="list-group" th:unless="${page.isEmpty()}">
        <a class="list-group-item list-group-item-action py-3"
           th:each="subscription : ${page.content}"
           th:href="@{/guide/{slug}(slug=${subscription.slug})}"
           th:text="${subscription.name}">서비스 이름</a>
    </div>

    <nav class="mt-4" th:if="${page.totalPages > 1}" aria-label="페이지">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/category/{slug}(slug=${category.slug}, page=${page.number - 1}, size=${page.size})}">← 이전</a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/category/{slug}(slug=${category.slug}, page=${page.number + 1}, size=${page.size})}">다음 →</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>

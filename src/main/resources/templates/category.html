<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${category.name} + ' 구독 해지 방법 | 구독 해지 가이드', ${category.name} + ' 구독 서비스의 해지 방법을 모았어요. 서비스를 고르면 단계별 화면 그림으로 볼 수 있어요.', '/category/' + ${category.slug})}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="wrap">
    <nav th:replace="~{fragments/layout :: breadcrumb(null, ${category.name})}"></nav>

    <h1 th:text="${category.name} + ' 해지 방법'">카테고리 해지 방법</h1>

    <p class="muted" th:if="${page.isEmpty()}">아직 등록된 서비스가 없어요.</p>

    <ul class="svc-list" th:unless="${page.isEmpty()}">
        <li th:each="subscription : ${page.content}">
            <a th:replace="~{fragments/ui :: serviceRow(${subscription}, ${stepCounts[subscription.id] ?: 0})}"></a>
        </li>
    </ul>

    <nav class="pager" th:if="${page.totalPages > 1}" aria-label="페이지">
        <a th:if="${page.hasPrevious()}"
           th:href="@{/category/{slug}(slug=${category.slug}, page=${page.number - 1}, size=${page.size})}">← 이전</a>
        <span th:unless="${page.hasPrevious()}" aria-disabled="true">← 이전</span>
        <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
        <a th:if="${page.hasNext()}"
           th:href="@{/category/{slug}(slug=${category.slug}, page=${page.number + 1}, size=${page.size})}">다음 →</a>
        <span th:unless="${page.hasNext()}" aria-disabled="true">다음 →</span>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>

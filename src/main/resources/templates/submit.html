<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('해지 방법 제보하기 | 구독 해지 가이드', '직접 해지해 본 구독 서비스의 해지 방법을 글로 알려 주세요. 관리자가 확인한 뒤 가이드로 올려요.', '/submit')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="wrap">
    <nav th:replace="~{fragments/layout :: breadcrumb(null, '제보하기')}"></nav>

    <h1>해지 방법 제보하기</h1>
    <p class="lead">직접 해지해 본 방법을 글로 알려 주세요. 관리자가 확인한 뒤 가이드로 올려요.</p>

    <!-- 오류가 있으면 입력 칸에 aria-invalid와 오류 문구 id(aria-describedby)를 붙여 화면 낭독기가 함께 읽게 한다 -->
    <form th:action="@{/submit}" th:object="${form}" method="post" enctype="multipart/form-data">
        <div class="field">
            <label for="serviceName">서비스 이름</label>
            <input type="text" id="serviceName" th:field="*{serviceName}" maxlength="50" placeholder="예: 유튜브 프리미엄"
                   th:attr="aria-invalid=${#fields.hasErrors('serviceName')} ? 'true' : null,
                            aria-describedby=${#fields.hasErrors('serviceName')} ? 'serviceName-error' : null">
            <p class="field-error" id="serviceName-error"
               th:if="${#fields.hasErrors('serviceName')}" th:errors="*{serviceName}">오류</p>
        </div>

        <div class="field">
            <label for="rawText">해지 방법</label>
            <textarea id="rawText" th:field="*{rawText}" rows="8" maxlength="1000"
                      placeholder="예: 앱 오른쪽 위 프로필을 누르고, 구매 및 멤버십에서 멤버십 해지를 눌러요."
                      th:attr="aria-invalid=${#fields.hasErrors('rawText')} ? 'true' : null,
                               aria-describedby=${#fields.hasErrors('rawText')} ? 'rawText-error rawText-help' : 'rawText-help'"></textarea>
            <p class="field-error" id="rawText-error"
               th:if="${#fields.hasErrors('rawText')}" th:errors="*{rawText}">오류</p>
            <p class="field-help" id="rawText-help">10자 이상 1000자 이하로 적어 주세요.</p>
        </div>

        <details class="more" th:open="${#fields.hasErrors('channels') or #fields.hasErrors('caution') or #fields.hasErrors('iconFile')}">
            <summary>더 알려 주실 수 있나요? (선택)</summary>

            <fieldset class="field">
                <legend>해지하는 곳</legend>
                <div class="check-row">
                    <label th:each="channel : ${T(com.whtngml.subscription_cancel_guide.domain.CancelChannel).values()}">
                        <input type="checkbox" th:field="*{channels}" th:value="${channel}">
                        <span th:text="${channel.label}">앱</span>
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="caution">주의할 점</label>
                <textarea id="caution" th:field="*{caution}" rows="3" maxlength="500"
                          placeholder="예: 앱스토어로 결제했다면 앱스토어 구독 관리에서 해지해야 해요."
                          th:attr="aria-invalid=${#fields.hasErrors('caution')} ? 'true' : null,
                                   aria-describedby=${#fields.hasErrors('caution')} ? 'caution-error' : null"></textarea>
                <p class="field-error" id="caution-error"
                   th:if="${#fields.hasErrors('caution')}" th:errors="*{caution}">오류</p>
            </div>

            <div class="field">
                <label for="iconFile">서비스 아이콘 이미지</label>
                <input type="file" id="iconFile" name="iconFile" accept="image/png,image/jpeg,image/webp"
                       th:attr="aria-invalid=${#fields.hasErrors('iconFile')} ? 'true' : null,
                                aria-describedby=${#fields.hasErrors('iconFile')} ? 'iconFile-error iconFile-help' : 'iconFile-help'">
                <p class="field-error" id="iconFile-error"
                   th:if="${#fields.hasErrors('iconFile')}" th:errors="*{iconFile}">오류</p>
                <p class="field-help" id="iconFile-help">PNG, JPEG, WebP · 200KB까지
                    <th:block th:if="${aiSteps != null}"><br>미리보기를 하면 고른 아이콘이 지워져요. 다시 골라 주세요.</th:block>
                </p>
            </div>
        </details>

        <input type="hidden" id="aiStepsJson" th:field="*{aiStepsJson}">

        <div class="notice" role="alert" th:if="${aiError != null}" th:text="${aiError}">AI 오류</div>

        <section id="aiPreview" th:if="${aiSteps != null}">
            <h2>AI가 이렇게 나눴어요</h2>
            <p class="muted">AI가 만든 단계라 틀릴 수 있어요. 관리자가 확인한 뒤 공개해요. 마음에 들지 않으면 글을 고치고 다시 미리보기를 누르세요.</p>
            <ol th:replace="~{fragments/steps :: stepList(${aiSteps}, null)}"></ol>
        </section>

        <div class="btn-row">
            <button class="btn btn-primary" type="submit" th:text="${aiSteps != null} ? '이대로 제출하기' : '제출하기'">제출하기</button>
            <button class="btn btn-secondary" type="submit" th:formaction="@{/submit/preview}"
                    th:if="${aiAvailable}">AI로 단계 미리보기</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>

<script th:if="${aiSteps != null}">
    // 미리보기 뒤에 글을 고치면 AI 단계가 글과 달라지므로 버린다
    (function () {
        var hidden = document.getElementById('aiStepsJson');
        var preview = document.getElementById('aiPreview');
        ['serviceName', 'rawText'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                hidden.value = '';
                preview.hidden = true;
            }, { once: true });
        });
    })();
</script>
</body>
</html>

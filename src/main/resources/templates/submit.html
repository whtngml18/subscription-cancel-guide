<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('해지 방법 제보하기 | 구독 해지 가이드', '직접 해지해 본 구독 서비스의 해지 방법을 글로 알려 주세요. 관리자가 확인한 뒤 가이드로 올려요.', '/submit')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader(true)}"></header>

<main class="container">
    <h1 class="h3">해지 방법 제보하기</h1>
    <p class="text-secondary">직접 해지해 본 방법을 글로 알려 주세요. 관리자가 확인한 뒤 가이드로 올려요.</p>

    <form class="card card-body mt-3" th:action="@{/submit}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label" for="serviceName">서비스 이름</label>
            <input class="form-control" th:errorclass="is-invalid" type="text" id="serviceName"
                   th:field="*{serviceName}" maxlength="50" placeholder="예: 유튜브 프리미엄">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('serviceName')}" th:errors="*{serviceName}">오류</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="rawText">해지 방법</label>
            <textarea class="form-control" th:errorclass="is-invalid" id="rawText" th:field="*{rawText}" rows="8" maxlength="1000"
                      placeholder="예: 앱 오른쪽 위 프로필을 누르고, 구매 및 멤버십에서 멤버십 해지를 눌러요."></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('rawText')}" th:errors="*{rawText}">오류</div>
            <div class="form-text">10자 이상 1000자 이하로 적어 주세요.</div>
        </div>

        <input type="hidden" id="aiStepsJson" th:field="*{aiStepsJson}">

        <div class="alert alert-warning" role="alert" th:if="${aiError != null}" th:text="${aiError}">AI 오류</div>

        <section id="aiPreview" class="mb-3" th:if="${aiSteps != null}">
            <h2 class="h5">AI가 이렇게 나눴어요</h2>
            <p class="text-secondary small">AI가 만든 단계라 틀릴 수 있어요. 관리자가 확인한 뒤 공개해요. 마음에 들지 않으면 글을 고치고 다시 미리보기를 누르세요.</p>
            <ol class="phone-list">
                <li th:each="step : ${aiSteps}">
                    <figure th:replace="~{fragments/phone :: phone(${step}, null)}"></figure>
                </li>
            </ol>
        </section>

        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary" type="submit" th:text="${aiSteps != null} ? '이대로 제출하기' : '제출하기'">제출하기</button>
            <button class="btn btn-outline-primary" type="submit" th:formaction="@{/submit/preview}"
                    th:if="${aiAvailable}">AI로 단계 미리보기</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>

<script th:if="${aiSteps != null}">
    // 미리보기 뒤에 글을 고치면 AI 단계가 글과 달라지므로 버린다
    (function () {
        var hidden = document.getElementById('aiStepsJson');
        var preview = document.getElementById('aiPreview');
        ['serviceName', 'rawText'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                hidden.value = '';
                preview.hidden = true;
            }, { once: true });
        });
    })();
</script>
</body>
</html>

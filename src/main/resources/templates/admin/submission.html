<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${submission.serviceName} + ' 제보 | 구독 해지 가이드'">제보 | 구독 해지 가이드</title>
</head>
<body>
<a th:href="@{/admin/submissions}">← 제보 검토</a>

<h1 th:text="${submission.serviceName} + ' 제보'">제보</h1>

<p>
    <span th:text="${submission.status.label}">검토 대기</span> ·
    <span th:text="${#temporals.format(submission.createdAt, 'yyyy년 M월 d일 HH:mm')}">제보 시각</span>
</p>

<h2>제보 원문</h2>
<p style="white-space: pre-line" th:text="${submission.rawText}">해지 방법 글</p>

<th:block th:if="${submission.pending}">
    <th:block th:if="${sameName != null}">
        <h2>기존 서비스로 승인</h2>
        <p th:text="'이미 \'' + ${sameName.name} + '\' 가이드가 있어요. 새로 만들지 않고 이 가이드를 고칠 수 있어요.'">이미 가이드가 있어요.</p>
        <form th:action="@{/admin/submissions/{id}/approve-existing(id=${submission.id})}" method="post">
            <button type="submit" th:text="'\'' + ${sameName.name} + '\'(으)로 승인'">기존 서비스로 승인</button>
        </form>
    </th:block>

    <h2>새 서비스로 승인</h2>
    <p>서비스 정보를 채우고 승인하면, 다음 화면에서 해지 단계를 입력해요.</p>

    <form th:action="@{/admin/submissions/{id}/approve(id=${submission.id})}" th:object="${form}" method="post">
        <div>
            <label for="categoryId">카테고리</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">선택하세요</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">카테고리</option>
            </select>
            <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">오류</p>
        </div>

        <div>
            <label for="name">서비스 이름</label>
            <input type="text" id="name" th:field="*{name}">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</p>
        </div>

        <div>
            <label for="slug">slug (주소에 쓰는 영어 이름)</label>
            <input type="text" id="slug" th:field="*{slug}" placeholder="youtube-premium">
            <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">오류</p>
        </div>

        <div>
            <label for="brandColor">브랜드 색</label>
            <input type="text" id="brandColor" th:field="*{brandColor}" placeholder="#FF0000">
            <p th:if="${#fields.hasErrors('brandColor')}" th:errors="*{brandColor}">오류</p>
        </div>

        <div>
            <label for="refundInfo">환불 안내</label>
            <textarea id="refundInfo" th:field="*{refundInfo}" rows="3"></textarea>
            <p th:if="${#fields.hasErrors('refundInfo')}" th:errors="*{refundInfo}">오류</p>
        </div>

        <div>
            <label for="verifiedAt">마지막 확인일</label>
            <input type="date" id="verifiedAt" th:field="*{verifiedAt}">
        </div>

        <button type="submit">새 서비스로 승인</button>
    </form>

    <h2>반려</h2>
    <p>반려한 제보는 공개되지 않아요. 기록은 남아요.</p>
    <form th:action="@{/admin/submissions/{id}/reject(id=${submission.id})}" method="post"
          onsubmit="return confirm('이 제보를 반려할까요?');">
        <button type="submit">반려</button>
    </form>
</th:block>
</body>
</html>

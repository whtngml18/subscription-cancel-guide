<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${subscription == null ? '새 서비스 등록' : subscription.name + ' 수정'} + ' | 구독 해지 가이드'">서비스 | 구독 해지 가이드</title>
</head>
<body>
<a th:href="@{/admin/guides}">← 가이드 관리</a>

<h1 th:text="${subscription == null ? '새 서비스 등록' : subscription.name + ' 수정'}">서비스</h1>

<p th:if="${message}" th:text="${message}">알림</p>

<form th:action="${subscription == null} ? @{/admin/guides/new} : @{/admin/guides/{id}/edit(id=${subscription.id})}"
      th:object="${form}" method="post">
    <div>
        <label for="categoryId">카테고리</label>
        <select id="categoryId" th:field="*{categoryId}">
            <option value="">선택하세요</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}">카테고리</option>
        </select>
        <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">오류</p>
    </div>

    <div>
        <label for="name">서비스 이름</label>
        <input type="text" id="name" th:field="*{name}" placeholder="디즈니 플러스">
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</p>
    </div>

    <div>
        <label for="slug">slug (주소에 쓰는 영어 이름)</label>
        <input type="text" id="slug" th:field="*{slug}" placeholder="disney-plus">
        <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">오류</p>
    </div>

    <div>
        <label for="brandColor">브랜드 색</label>
        <input type="text" id="brandColor" th:field="*{brandColor}" placeholder="#113CCF">
        <p th:if="${#fields.hasErrors('brandColor')}" th:errors="*{brandColor}">오류</p>
    </div>

    <div>
        <label for="refundInfo">환불 안내</label>
        <textarea id="refundInfo" th:field="*{refundInfo}" rows="3"></textarea>
        <p th:if="${#fields.hasErrors('refundInfo')}" th:errors="*{refundInfo}">오류</p>
    </div>

    <div>
        <label for="verifiedAt">마지막 확인일</label>
        <input type="date" id="verifiedAt" th:field="*{verifiedAt}">
    </div>

    <button type="submit" th:text="${subscription == null ? '등록' : '저장'}">저장</button>
    <a th:href="@{/admin/guides}">취소</a>
</form>

<th:block th:if="${subscription != null}">
    <th:block th:unless="${submissions.isEmpty()}">
        <h2>제보 원문</h2>
        <p>사용자가 보낸 글이에요. 보면서 해지 단계를 입력하세요.</p>
        <blockquote th:each="submission : ${submissions}">
            <p style="white-space: pre-line" th:text="${submission.rawText}">제보 글</p>
            <small th:text="${#temporals.format(submission.createdAt, 'yyyy년 M월 d일')} + ' 제보'">제보일</small>
        </blockquote>
    </th:block>

    <h2>해지 단계</h2>

    <a th:href="@{/admin/guides/{id}/steps/new(id=${subscription.id})}">+ 단계 추가</a>
    <a th:href="@{/guide/{slug}(slug=${subscription.slug})}">사이트에서 보기</a>

    <p th:if="${steps.isEmpty()}">아직 등록된 해지 단계가 없어요.</p>

    <ol th:unless="${steps.isEmpty()}">
        <li th:each="step : ${steps}">
            <strong th:text="${step.stepOrder} + '단계'">1단계</strong>
            [<span th:text="${step.screenName}">화면</span>]
            <span th:text="${step.targetLabel}">누를 버튼</span>
            <a th:href="@{/admin/guides/{id}/steps/{stepId}/edit(id=${subscription.id}, stepId=${step.id})}">수정</a>
            <form th:action="@{/admin/guides/{id}/steps/{stepId}/delete(id=${subscription.id}, stepId=${step.id})}"
                  method="post" style="display: inline"
                  onsubmit="return confirm('이 단계를 삭제할까요?');">
                <button type="submit">삭제</button>
            </form>
        </li>
    </ol>

    <h2>서비스 삭제</h2>
    <p>서비스를 삭제하면 해지 단계도 모두 함께 삭제돼요.</p>
    <form th:action="@{/admin/guides/{id}/delete(id=${subscription.id})}" method="post"
          onsubmit="return confirm('이 서비스와 해지 단계를 모두 삭제할까요?');">
        <button type="submit">서비스 삭제</button>
    </form>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: adminHead('관리자 로그인 | 구독 해지 가이드')}"></head>
<body>
<main class="login-box">
    <h1>관리자 로그인</h1>

    <p class="alert-error" role="alert" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않아요.</p>
    <p class="alert-success" th:if="${param.logout}">로그아웃했어요.</p>

    <form th:action="@{/admin/login}" method="post">
        <div class="field">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </form>

    <p class="muted"><a th:href="@{/}">사이트로 돌아가기</a></p>
</main>
</body>
</html>

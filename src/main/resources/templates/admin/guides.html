<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>가이드 관리 | 구독 해지 가이드</title>
</head>
<body>
<h1>가이드 관리</h1>

<form th:action="@{/admin/logout}" method="post">
    <button type="submit">로그아웃</button>
</form>

<p th:if="${message}" th:text="${message}">알림</p>

<a th:href="@{/admin/guides/new}">+ 새 서비스 등록</a>

<p th:if="${subscriptions.isEmpty()}">등록된 서비스가 없어요.</p>

<ul th:unless="${subscriptions.isEmpty()}">
    <li th:each="subscription : ${subscriptions}">
        <span th:text="${subscription.name}">서비스 이름</span>
        (<span th:text="${subscription.category.name}">카테고리</span>)
        <a th:href="@{/admin/guides/{id}/edit(id=${subscription.id})}">수정</a>
        <a th:href="@{/guide/{slug}(slug=${subscription.slug})}">사이트에서 보기</a>
        <span th:with="count=${feedbackCounts.get(subscription.id)}"
              th:text="${count == null}
                        ? '피드백 없음'
                        : '맞았어요 ' + ${count.helpful} + ' · 달라요 ' + ${count.notHelpful}">맞았어요 0 · 달라요 0</span>
    </li>
</ul>
</body>
</html>

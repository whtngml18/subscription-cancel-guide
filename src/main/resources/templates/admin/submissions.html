<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: noindexHead('제보 검토 | 구독 해지 가이드')}"></head>
<body>
<header th:replace="~{fragments/layout :: adminHeader}"></header>

<main class="container">
    <h1 class="h3 mb-3">제보 검토</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}">알림</div>

    <p class="text-secondary" th:if="${page.isEmpty()}">검토할 제보가 없어요.</p>

    <div class="list-group" th:unless="${page.isEmpty()}">
        <a class="list-group-item list-group-item-action d-flex flex-wrap justify-content-between gap-2 py-3"
           th:each="submission : ${page.content}"
           th:href="@{/admin/submissions/{id}(id=${submission.id})}">
            <span class="fw-semibold" th:text="${submission.serviceName}">서비스 이름</span>
            <small class="text-secondary" th:text="${#temporals.format(submission.createdAt, 'M월 d일 HH:mm')}">제보 시각</small>
        </a>
    </div>

    <nav class="mt-4" th:if="${page.totalPages > 1}" aria-label="페이지">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/admin/submissions(page=${page.number - 1})}">← 이전</a>
            </li>
            <li class="page-item active">
                <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                <a class="page-link" th:href="@{/admin/submissions(page=${page.number + 1})}">다음 →</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
